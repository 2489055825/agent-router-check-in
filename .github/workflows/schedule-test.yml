name: 调度器测试

# 临时文件，用来验证 GitHub 的定时器在这个仓库里到底有没有注册成功。
# 每 5 分钟触发一次，只打印一行字，不碰签到、不装任何东西。
# 验证完就删掉这个文件。
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 记录触发时间
        run: |
          echo "定时器触发了"
          echo "UTC 时间: $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "北京时间: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          echo "触发事件: ${{ github.event_name }}"
